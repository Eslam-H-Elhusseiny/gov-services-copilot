services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
            - app_storage:/var/www/html/storage
            - app_bootstrap_cache:/var/www/html/bootstrap/cache
        environment:
            - APP_ENV=${APP_ENV:-local}
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=${DB_DATABASE:-gov_services_copilot}
            - DB_USERNAME=${DB_USERNAME:-app}
            - DB_PASSWORD=${DB_PASSWORD:-change-me}
        depends_on:
            mysql:
                condition: service_healthy
            qdrant:
                condition: service_healthy
        networks:
            - gsc

    web:
        image: nginx:1.28.0-alpine
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - gsc

    mysql:
        image: mysql:8.0.46
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
            MYSQL_DATABASE: ${DB_DATABASE:-gov_services_copilot}
            MYSQL_USER: ${DB_USERNAME:-app}
            MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - gsc

    qdrant:
        image: qdrant/qdrant:v1.20.2
        ports:
            - "6333:6333"
        volumes:
            - qdrant_data:/qdrant/storage
        healthcheck:
            test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - gsc

volumes:
    mysql_data:
    qdrant_data:
    app_storage:
    app_bootstrap_cache:

networks:
    gsc:
        driver: bridge
